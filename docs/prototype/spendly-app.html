<style>
:root{--sf:#fff;--wash:#EAF2FF;--tx:#15233E;--mu:#5F6C86;--tn:#EAF1FF;--fd:#F5F8FE;--ac:#2F6BF0;--sk:#8DB4FF;--ln:#E6ECF7;--gd:#F5B83D;--gr:linear-gradient(180deg,#D8E7FF 0,#EEF4FF 240px,#fff 400px);--sh:0 6px 24px rgba(47,107,240,.10)}

*{box-sizing:border-box}body{margin:0;background:var(--sf);color:var(--tx);font:16px/1.4 -apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s,background .2s}button:active{transform:scale(.97)}
h1{font:700 30px/1.1 -apple-system,'SF Pro Display',sans-serif;letter-spacing:-.02em;margin:0}h2{font:700 19px/1.2 -apple-system,sans-serif;margin:0;letter-spacing:-.01em}p{margin:0}.m{color:var(--mu);font-size:14px}
#app{max-width:430px;margin:0 auto;min-height:100dvh;position:relative;overflow:hidden;background:var(--sf)}
.page{display:none;min-height:100dvh;flex-direction:column;background:var(--gr)}.page.on{display:flex;animation:in .4s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.h{padding:calc(env(safe-area-inset-top,0px) + 50px) 20px 40px;display:flex;flex-direction:column;gap:12px}
.sh{margin-top:-22px;background:var(--sf);border-radius:28px 28px 0 0;padding:22px 20px 150px;flex:1;display:flex;flex-direction:column;gap:14px}
.r{display:flex;justify-content:space-between;align-items:center;gap:12px}.f{flex:1}.cap{font-size:12px;letter-spacing:.14em;color:var(--mu)}
.big{font:700 52px/1 -apple-system,'SF Pro Display',sans-serif;letter-spacing:-.03em}.big small{font:600 16px sans-serif;color:var(--mu);margin-left:6px}
.seg2{display:flex;gap:4px;height:10px}.seg2 i{border-radius:5px;min-width:6px;animation:gw .8s cubic-bezier(.2,.8,.2,1) both}@keyframes gw{from{transform:scaleX(.1);opacity:0}}
.chip{align-self:flex-start;border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600;background:var(--sf);box-shadow:var(--sh)}.chip.gd{background:var(--gd);color:#15233E}

.cc{border-radius:20px;padding:14px 16px;color:#15233E}.cc .r b{font-size:17px}.cc p{font-size:13px;opacity:.8}.pb{height:6px;border-radius:3px;background:rgba(21,35,62,.1);margin-top:10px;overflow:hidden}.pb i{display:block;height:100%;border-radius:3px;animation:gw .8s both;transform-origin:left}

function aside(i,a){const g=S.goals[i],add=Math.min(a,g.t-g.s);g.s+=add;S.sav+=add;R.goals();toast(`<b>${f(add)} set aside</b><br>${g.n}`);anim()}
function buy(i){const w=S.wishes[i];S.e.push({d:S.today,c:'Other',a:w.p});S.wish=Math.max(0,S.wish-w.p);S.wishes.splice(i,1);R.goals();anim()}
function addWish(){let src='Jumia';window.pickSrc=s=>{src=s;document.querySelectorAll('#ws .cp').forEach(b=>b.classList.toggle('on',b.textContent==s))};window.saveWish=()=>{const n=$('#wn').value.trim(),p=+$('#wp').value.replace(/\D/g,'');if(!n||!p)return;S.wishes.push({n,p,src});S.wish+=p;closeOv()};openOv(`<h2>Add a wish</h2><input type="text" id="wn" placeholder="What do you want to buy?" aria-label="Name"><input type="tel" id="wp" inputmode="numeric" placeholder="Price (XAF)" aria-label="Price"><div class="wr" id="ws">${['Jumia','Instagram','Shein','Other'].map((s,i)=>`<button class="cp ${i?'':'on'}" onclick="pickSrc('${s}')">${s}</button>`).join('')}</div><button class="b" onclick="saveWish()">Save wish</button>`)}
</script></body></html>
